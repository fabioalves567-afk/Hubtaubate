<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#001E50"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fahrwerk"/>
<title>Fahrwerk · Rotativa</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;width:100%;overflow-x:hidden;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F5F6F8;overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
input,select{-webkit-appearance:none;appearance:none;font-size:16px!important;font-family:inherit;}
input:focus,select:focus{outline:none!important;border-color:#00B0F0!important;box-shadow:0 0 0 3px rgba(0,176,240,0.2)!important;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
::-webkit-scrollbar{height:3px;width:3px;}
::-webkit-scrollbar-thumb{background:#D0D4DC;border-radius:2px;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
#btn-atualizar.girando{animation:spin 0.8s linear infinite;}

/* Estrutura */
#app{min-height:100vh;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));}
#header{position:sticky;top:0;z-index:100;background:#001E50;border-bottom:3px solid #00B0F0;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 12px rgba(0,21,80,0.3);}
#header-row{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
#logo{display:flex;align-items:center;gap:10px;}
#logo-badge{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);font-size:17px;font-weight:900;color:#fff;}
#logo-title{font-size:14px;font-weight:700;color:#fff;}
#logo-sub{font-family:'Courier New',monospace;font-size:9px;color:rgba(255,255,255,0.45);}
#ciclo-badge{border-radius:20px;padding:5px 12px;font-family:'Courier New',monospace;font-size:11px;font-weight:500;display:none;}
#dias-bar{display:flex;border-top:1px solid rgba(255,255,255,0.1);}
.dia-btn{flex:1;padding:10px 4px;border:none;background:transparent;color:rgba(255,255,255,0.5);font-weight:700;font-size:13px;border-bottom:2px solid transparent;transition:all .15s;}
.dia-btn.ativo{background:rgba(0,176,240,0.25);color:#00B0F0;border-bottom:2px solid #00B0F0;}
#content{padding:14px 14px 10px;max-width:700px;margin:0 auto;}
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;border-top:1px solid #EAECF0;box-shadow:0 -4px 16px rgba(0,21,80,0.1);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;border:none;background:transparent;color:#8B919E;min-height:60px;font-size:10px;gap:3px;}
.nav-btn.ativo{color:#003D8F;}
.nav-btn .nav-icon{font-size:18px;line-height:1;}
.nav-btn.ativo .nav-icon{font-size:20px;}
.nav-dot{width:20px;height:2px;border-radius:1px;background:#003D8F;display:none;}
.nav-btn.ativo .nav-dot{display:block;}
.nav-badge{position:absolute;top:6px;right:50%;margin-right:-18px;width:16px;height:16px;border-radius:50%;background:#00875A;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;}

/* Cards */
.card{background:#fff;border-radius:14px;border:1px solid #EAECF0;box-shadow:0 1px 6px rgba(0,21,80,0.07);margin-bottom:10px;}
.card-header{padding:14px 16px;border-bottom:1px solid #EAECF0;font-size:14px;font-weight:700;color:#1A1E2A;}
.card-body{padding:14px 16px;}

/* Inputs */
.inp{padding:12px 14px;border-radius:10px;border:1.5px solid #D0D4DC;font-size:16px;color:#1A1E2A;background:#fff;width:100%;display:block;outline:none;}
.inp-mono{font-family:'Courier New',monospace;}
.lbl{font-size:12px;font-weight:600;color:#8B919E;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:block;}
.inp-count{font-family:'Courier New',monospace;font-size:10px;color:#8B919E;text-align:right;margin-top:3px;}

/* Botões */
.btn-main{padding:14px 20px;border-radius:12px;border:none;background:linear-gradient(90deg,#001E50,#003D8F);color:#fff;font-weight:700;font-size:16px;width:100%;box-shadow:0 3px 10px rgba(0,30,80,0.25);}
.btn-sec{padding:13px 20px;border-radius:12px;border:1.5px solid #D0D4DC;background:#fff;color:#4A5060;font-weight:600;font-size:15px;}
.btn-pill{padding:10px 16px;border-radius:22px;border:none;background:#F5F6F8;color:#4A5060;font-weight:600;font-size:14px;flex-shrink:0;outline:1.5px solid #D0D4DC;}
.btn-pill.ativo{background:#003D8F;color:#fff;outline:none;}
.btn-pill.verde.ativo{background:#00875A;outline:none;}
.btn-pill.verde{outline:1.5px solid #D0D4DC;}

/* Grade */
.op-card{background:#fff;border-radius:14px;border:1px solid #EAECF0;box-shadow:0 1px 6px rgba(0,21,80,0.07);margin-bottom:10px;overflow:hidden;}
.op-header{padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #EAECF0;background:#F5F6F8;}
.op-header.falta{background:#FEF2F2;}
.ciclos-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 12px;}
.bloco-lbl{font-size:10px;font-weight:600;letter-spacing:1px;margin-bottom:6px;padding-left:6px;}
.bloco-lbl.azul{color:#003D8F;border-left:2px solid #003D8F;}
.bloco-lbl.verde{color:#00875A;border-left:2px solid #00875A;}
.ciclos-row{display:flex;gap:5px;margin-bottom:8px;}
.ciclo-cell{flex-shrink:0;min-width:54px;border-radius:8px;padding:6px 4px;text-align:center;cursor:pointer;position:relative;}
.ciclo-cell .ciclo-hora{font-family:'Courier New',monospace;font-size:9px;color:#8B919E;}
.ciclo-cell .ciclo-cod{font-family:'Courier New',monospace;font-size:12px;font-weight:600;margin-top:1px;}
.ciclo-cell .over-dot{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#EA580C;display:none;}
.ciclo-cell.tem-over .over-dot{display:block;}
.janta-bar{background:#FEF3C7;border:1px solid rgba(245,158,11,0.3);border-radius:8px;padding:5px 10px;margin-bottom:8px;font-size:11px;color:#92400E;text-align:center;font-weight:600;}

/* Seletor posto */
.posto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
.posto-btn{padding:11px 6px;border-radius:10px;font-family:'Courier New',monospace;font-weight:500;font-size:13px;}

/* Toast */
#toast{position:fixed;bottom:calc(60px + env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);border-radius:24px;padding:11px 22px;font-size:14px;font-weight:600;color:#fff;z-index:1000;box-shadow:0 8px 32px rgba(0,21,80,0.25);display:none;align-items:center;gap:8px;white-space:nowrap;animation:slideUp .2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(12px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}

/* Bottom sheet modal */
#modal-overlay{position:fixed;inset:0;background:rgba(0,21,80,0.5);display:none;align-items:flex-end;justify-content:center;z-index:999;animation:fadeIn .2s ease;}
#modal-overlay.aberto{display:flex;}
#modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;padding-bottom:env(safe-area-inset-bottom,20px);box-shadow:0 -8px 40px rgba(0,21,80,0.2);animation:sheetUp .25s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{display:flex;justify-content:center;padding:12px 0 8px;}
.modal-handle-bar{width:36px;height:4px;border-radius:2px;background:#D0D4DC;}
.modal-body{padding:0 20px 16px;}

/* Mês */
.mes-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mes-dia{border:1.5px solid #EAECF0;border-radius:10px;padding:6px 5px;min-height:80px;cursor:pointer;overflow:hidden;background:#fff;}
.mes-dia.fim{background:#F0F2F5;opacity:.7;cursor:default;}
.mes-dia.sab-trab{background:#E6F6F0;border-color:rgba(0,135,90,0.35);}
.mes-dia.hoje{box-shadow:0 0 0 2px #003D8F;}
.mes-dia.detalhe{background:#E8F4FB;border-color:#00B0F0;box-shadow:0 0 0 2px #00B0F0;}
.mes-dia-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#1A1E2A;}
.mes-dia-num.hoje-n{background:#003D8F;color:#fff;font-weight:700;}
.mes-dia-num.sab-n{background:#00875A;color:#fff;font-weight:700;}
.mes-dia-num.fim-n{color:#D0D4DC;}
.mes-pill{display:inline-block;border-radius:3px;padding:0 3px;font-family:'Courier New',monospace;font-size:8px;font-weight:600;margin:1px;}

/* Abas internas */
.sub-tabs{display:flex;gap:8px;margin-bottom:16px;}
.scroll-pills{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:14px;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-row">
      <div id="logo">
        <div id="logo-badge">W</div>
        <div>
          <div id="logo-title">Fahrwerk · Rotativa</div>
          <div id="logo-sub" id="logo-sub">VW TAUBATÉ · B-OTM-4</div>
        </div>
      </div>
      <div id="ciclo-badge"></div>
      <button onclick="atualizarApp()" title="Atualizar app" style="width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation" id="btn-atualizar">🔄</button>
    </div>
    <div id="dias-bar"></div>
  </div>
  <div id="content"></div>
  <div id="bottomnav"></div>
</div>
<div id="toast"></div>
<div id="modal-overlay">
  <div id="modal-sheet">
    <div class="modal-handle"><div class="modal-handle-bar"></div></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
'use strict';

// ── DADOS ─────────────────────────────────────────────────────────────────────
const SEQ_DEF=[1,2,3,4,12,5,6,7,8,9,12,17,15,13,10,18,16,14,11,12];
function getSeq(){return DB.seq||SEQ_DEF;}
function getPostos(){return DB.postos||POSTOS_DEF;}
const OPS_DEF=[{id:"9000010",nome:"Francielly"},{id:"9000011",nome:"Operador 11"},{id:"9000012",nome:"Operador 12"},{id:"9000013",nome:"Operador 13"},{id:"9000014",nome:"Operador 14"},{id:"9000015",nome:"Maykon"},{id:"9000016",nome:"Operador 16"},{id:"9000017",nome:"Operador 17"},{id:"9000018",nome:"Operador 18"},{id:"9000019",nome:"Operador 19"},{id:"9000020",nome:"Operador 20"},{id:"9000021",nome:"Bruno F."}];
const POSTOS_DEF=[{cod:"OP-01",desc:"Eixo Traseiro"},{cod:"OP-02",desc:"Escapamento Secundário"},{cod:"OP-03",desc:"Amortecedor Eixo LE"},{cod:"OP-04",desc:"Amortecedor Eixo LD"},{cod:"OP-05",desc:"Defletoras + Tubulação Freio LE"},{cod:"OP-06",desc:"Pega do tanque / tubulação freio 2"},{cod:"OP-07",desc:"Auxiliar tanque / tubulação Freio 1"},{cod:"OP-08",desc:"Prep. Operação 09"},{cod:"OP-09",desc:"Operação 09"},{cod:"OP-10",desc:"Fixação Eixo Traseiro LE"},{cod:"OP-11",desc:"Fixação Eixo Traseiro LD"},{cod:"OP-12",desc:"Pre torque Torre / Coxins"},{cod:"OP-13",desc:"Fixação Quadro Auxiliar LE"},{cod:"OP-14",desc:"Fixação Quadro Auxiliar LD"},{cod:"OP-15",desc:"Fixação Tanque LE"},{cod:"OP-16",desc:"Fixação Tanque LD"},{cod:"OP-17",desc:"Fixação Amortec. Traseiro LE"},{cod:"OP-18",desc:"Fixação Amortec. Traseiro LD"}];
const DIAS=["Seg","Ter","Qua","Qui","Sex"];
const DIAS_F=["Segunda","Terça","Quarta","Quinta","Sexta"];
const TIPO_FALTA={falta:{label:"Falta",cor:"#DC2626",bg:"#FEF2F2"},atestado:{label:"Atestado",cor:"#EA580C",bg:"#FFF7ED"},ferias:{label:"Férias",cor:"#003D8F",bg:"#E8F4FB"},folga:{label:"Folga",cor:"#00875A",bg:"#E6F6F0"}};
const CORES_P=["#0057B8","#00875A","#B45309","#9333EA","#DC2626","#0891B2","#059669","#7C3AED","#EA580C","#0369A1","#65A30D","#BE185D","#1D4ED8","#D97706","#15803D","#7E22CE","#B91C1C","#0284C7"];
const GRADS=[["#001E50","#003D8F"],["#00875A","#00B0A0"],["#7C3AED","#9333EA"],["#B45309","#D97706"],["#DC2626","#EF4444"],["#0891B2","#06B6D4"],["#065F46","#059669"],["#BE185D","#EC4899"],["#C2410C","#EA580C"],["#1D4ED8","#3B82F6"],["#4D7C0F","#65A30D"],["#6B21A8","#A855F7"],["#0E7490","#06B6D4"],["#7C2D12","#EA580C"],["#1E1B4B","#4338CA"],["#064E3B","#059669"],["#4A044E","#9333EA"],["#7F1D1D","#DC2626"]];

// Ciclos: C1-C12=15h-21h | Janta | C13-C14=22h-23h | C15=23h-23:45
const CICLOS=(()=>{const r=[],f=x=>`${String(Math.floor(x/60)).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;let m=900;for(let i=0;i<15;i++){if(i===12)m=1320;const d=i===14?45:30;r.push({idx:i,label:`C${i+1}`,ini:f(m),fim:f(m+d),dur:d,posJanta:i>=12});m+=d;}return r;})();
const CICLOS_SAB=(()=>{const r=[],f=x=>`${String(Math.floor(x/60)).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;let m=720;for(let i=0;i<12;i++){r.push({idx:i,label:`C${i+1}`,ini:f(m),fim:f(m+30)});m+=30;}return r;})();

// ── UTILS ─────────────────────────────────────────────────────────────────────
const corP=n=>CORES_P[(n-1+CORES_P.length)%CORES_P.length];
const pInfo=n=>{const P=getPostos();return n>=1&&n<=P.length?{...P[n-1],cor:corP(n),num:n}:null;};
const ini=nome=>nome.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
const fmtD=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`;};
const fmtTS=iso=>{if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});};
const diaSem=iso=>{if(!iso)return"";return["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(iso+"T12:00:00").getDay()];};
const logH=(d,a,det)=>({...d,historico:[{ts:new Date().toISOString(),acao:a,detalhe:det},...(d.historico||[])].slice(0,400)});
const gerarRot=idx=>{const s=getSeq();return Array.from({length:5},(_,d)=>Array.from({length:15},(_,c)=>s[(idx+d*15+c)%s.length]));};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ── BANCO ─────────────────────────────────────────────────────────────────────
const DB0=(ops)=>({versao:9,operadores:ops||OPS_DEF,rotacaoOverride:{},rotacaoSab:{},travados:{},sabados:[],faltas:[],historico:[],seq:null,postos:null});
const DB_KEY="fahrwerk_db_v9";
let DB=DB0();
try{const v=localStorage.getItem(DB_KEY);if(v){const p=JSON.parse(v);if(p.versao>=6){DB=p;if(!DB.travados)DB.travados={};}}}catch{}
const saveDB=()=>{try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch{}};

// ── ESTADO ────────────────────────────────────────────────────────────────────
let ABA="grade";
let DIA=(()=>{const d=new Date().getDay();return d>=1&&d<=5?d-1:0;})();
let CICLO_VIVO=null;

// Editor
let editOp=null,editDia=0,editCiclo=null,editVal=null;
let editSabOp=null,editSabCiclo=null,editSabVal=null,sabVerAba="lista";
let sabData="",sabObs="";
let fOp="",fData="",fTipo="falta",fObs="",fFiltro="todos";
let hFiltro="todos";
let novoNome="",novoId="",opAba="lista";
let mesAno=new Date().getFullYear(),mesMes=new Date().getMonth();
// Postos e sequência
let novoCod="",novaDesc="",postosAba="lista",seqEditando=false,seqTemp=null;
let opFiltroMes="todos",diaDetalhe=null;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getOps(){return DB.operadores||OPS_DEF;}
function getPosto(opId,diaIdx,cicloIdx){const trav=DB.travados?.[opId];if(trav!==undefined)return trav;const over=DB.rotacaoOverride?.[opId]?.[diaIdx]?.[cicloIdx];if(over!==undefined)return over;const idx=getOps().findIndex(o=>o.id===opId);return gerarRot(Math.max(0,idx))[diaIdx]?.[cicloIdx]||1;}
function isTravado(opId){return DB.travados?.[opId]!==undefined;}
function getPostoSab(opId,cicloIdx){const r=DB.rotacaoSab?.[opId];if(r&&r[cicloIdx]!==undefined)return r[cicloIdx];const idx=getOps().findIndex(o=>o.id===opId);const s=getSeq();return s[(Math.max(0,idx)+cicloIdx)%s.length];}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer=null;
function toast(msg,tipo="ok"){
  const el=document.getElementById("toast");
  el.textContent=(tipo==="warn"?"⚠ ":"✓ ")+msg;
  el.style.background=tipo==="warn"?"#92400E":"#00875A";
  el.style.display="flex";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display="none",3000);
}

// ── AVATAR HTML ───────────────────────────────────────────────────────────────
function avHtml(nome,idx,size=36){
  const[c1,c2]=GRADS[idx%GRADS.length];
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,${c1},${c2});display:flex;align-items:center;justify-content:center;font-size:${Math.floor(size*0.31)}px;font-weight:700;color:#fff;user-select:none;">${esc(ini(nome))}</div>`;
}

// ── CICLO VIVO ────────────────────────────────────────────────────────────────
function atualizarCicloVivo(){
  const d=new Date(),m=d.getHours()*60+d.getMinutes(),dow=d.getDay();
  const badge=document.getElementById("ciclo-badge");
  if(!badge)return;
  if(dow===6&&m>=720&&m<1080){CICLO_VIVO={sab:Math.floor((m-720)/30)};badge.style.display="block";badge.style.background="rgba(0,135,90,0.3)";badge.style.border="1px solid rgba(0,135,90,0.5)";badge.style.color="#00875A";badge.textContent=`SAB C${CICLO_VIVO.sab+1}`;}
  else if(m>=900&&m<1260){CICLO_VIVO=Math.floor((m-900)/30);badge.style.display="block";badge.style.background="rgba(0,176,240,0.2)";badge.style.border="1px solid rgba(0,176,240,0.5)";badge.style.color="#00B0F0";badge.textContent=`▶ ${CICLOS[CICLO_VIVO]?.label}`;}
  else if(m>=1260&&m<1320){CICLO_VIVO="janta";badge.style.display="block";badge.style.background="rgba(245,158,11,0.25)";badge.style.border="1px solid rgba(245,158,11,0.5)";badge.style.color="#F59E0B";badge.textContent="🍽 Janta";}
  else if(m>=1320&&m<1380){CICLO_VIVO=12+Math.floor((m-1320)/30);badge.style.display="block";badge.style.background="rgba(0,176,240,0.2)";badge.style.border="1px solid rgba(0,176,240,0.5)";badge.style.color="#00B0F0";badge.textContent=`▶ ${CICLOS[CICLO_VIVO]?.label}`;}
  else if(m>=1380&&m<=1425){CICLO_VIVO=14;badge.style.display="block";badge.style.background="rgba(0,176,240,0.2)";badge.style.border="1px solid rgba(0,176,240,0.5)";badge.style.color="#00B0F0";badge.textContent="▶ C15";}
  else{CICLO_VIVO=null;badge.style.display="none";}
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const ops=getOps();
  if(!editOp&&ops.length)editOp=ops[0].id;
  if(!fOp&&ops.length)fOp=ops[0].id;
  if(!editSabOp&&ops.length)editSabOp=ops[0].id;

  document.getElementById("logo-sub").textContent=`VW TAUBATÉ · B-OTM-4 · ${ops.length} operadores`;

  // Barra de dias
  const diasBar=document.getElementById("dias-bar");
  if(ABA==="grade"){
    diasBar.style.display="flex";
    diasBar.innerHTML=DIAS.map((d,i)=>`<button class="dia-btn${i===DIA?" ativo":""}" onclick="setDia(${i})">${d}</button>`).join("");
  } else {
    diasBar.style.display="none";
  }

  // Bottom nav
  const ABAS=[{k:"grade",i:"▦",l:"Grade"},{k:"mes",i:"📆",l:"Mês"},{k:"equipe",i:"👥",l:"Equipe"},{k:"editor",i:"✎",l:"Editor"},{k:"postos",i:"🔧",l:"Postos"},{k:"sabados",i:"📅",l:"Sábado"},{k:"faltas",i:"👤",l:"Faltas"},{k:"hist",i:"📋",l:"Hist."}];
  document.getElementById("bottomnav").innerHTML=ABAS.map(({k,i,l})=>`
    <button class="nav-btn${ABA===k?" ativo":""}" onclick="setAba('${k}')" style="position:relative">
      <span class="nav-icon">${i}</span>
      <span>${l}</span>
      <span class="nav-dot"></span>
      ${k==="equipe"&&ABA!=="equipe"?`<span class="nav-badge">${ops.length}</span>`:""}
    </button>`).join("");

  // Conteúdo
  const content=document.getElementById("content");
  if(ABA==="grade") content.innerHTML=renderGrade(ops);
  else if(ABA==="mes") content.innerHTML=renderMes(ops);
  else if(ABA==="equipe") content.innerHTML=renderEquipe(ops);
  else if(ABA==="editor") content.innerHTML=renderEditor(ops);
  else if(ABA==="sabados") content.innerHTML=renderSabados(ops);
  else if(ABA==="faltas") content.innerHTML=renderFaltas(ops);
  else if(ABA==="hist") content.innerHTML=renderHist();
  else if(ABA==="postos") content.innerHTML=renderPostos();

  bindEvents();
}

}

// ── MÊS ───────────────────────────────────────────────────────────────────────
function renderMes(ops){

  const diasDoMes=[];
  for(let d=1;d<=total;d++){const dt=new Date(mesAno,mesMes,d),dow=dt.getDay(),iso=`${mesAno}-${String(mesMes+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;diasDoMes.push({d,dow,iso,diaIdx:dow===0||dow===6?null:dow-1,isSab:dow===6,isSabTrab:dow===6&&DB.sabados?.some(s=>s.data===iso),isDom:dow===0});}
  const offset=diasDoMes[0]?.dow===0?6:diasDoMes[0]?.dow-1;

      <div style="font-size:15px;font-weight:700;color:#1A1E2A;text-transform:capitalize;min-width:160px;text-align:center">${nomeMes}</div>
      <button onclick="navMes(1)" style="width:36px;height:36px;border-radius:50%;border:1px solid #D0D4DC;background:#fff;font-size:18px;display:flex;align-items:center;justify-content:center">›</button>
    </div>
    <button onclick="exportPDF()" style="display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:10px;border:none;background:linear-gradient(90deg,#001E50,#003D8F);color:#fff;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,21,80,0.25)">📄 Exportar PDF</button>
  </div>
  <div class="scroll-pills" style="margin-bottom:14px">
    <button class="btn-pill${opFiltroMes==="todos"?" ativo":""}" onclick="setOpFiltroMes('todos')">Todos</button>

    <div style="font-size:12px;font-weight:700;color:#003D8F;margin-bottom:8px;letter-spacing:1px;text-transform:uppercase">Rotativa — ${nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)} · Fahrwerk B-OTM-4</div>
    <div class="mes-grid" style="margin-bottom:3px">
      ${["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(d=>`<div style="text-align:center;font-size:10px;font-weight:700;color:${d==="Sáb"?"#00875A":d==="Dom"?"#DC2626":"#003D8F"};padding:4px 0">${d}</div>`).join("")}
    </div>
    <div class="mes-grid">
      ${Array.from({length:offset},(_,i)=>`<div key="v${i}"></div>`).join("")}
      ${diasDoMes.map(({d,iso,diaIdx,isSab,isSabTrab,isDom})=>{
        const isFim=isDom||(isSab&&!isSabTrab);
        const isHoje=iso===hoje.toISOString().slice(0,10);
        const isDetalhe=diaDetalhe?.iso===iso;
        const hasFalta=opsEx.some(op=>DB.faltas?.some(f=>f.opId===op.id&&f.data===iso));
        let cls="mes-dia";
        if(isFim)cls+=" fim";else if(isSabTrab)cls+=" sab-trab";

        </div>`;

        if(!isFim){

            inner+=`<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:2px">`;

                postos.forEach((pNum,ci)=>{const p=pInfo(pNum);if(p)inner+=`<span style="font-family:'Courier New',monospace;font-size:8px;font-weight:700;color:${p.cor};background:${p.cor}18;border:1px solid ${p.cor}44;border-radius:3px;padding:1px 4px">C${ci+1} ${p.cod}</span>`;});

        const onclick=isFim?"":"onclick=\"toggleDiaDetalhe('"+iso+"',"+JSON.stringify(diaIdx)+","+isSabTrab+")\"";
        return`<div class="${cls}" ${onclick}>${inner}</div>`;
      }).join("")}
    </div>
  </div>`;

  if(diaDetalhe){
    const ciclosList=diaDetalhe.isSabTrab?CICLOS_SAB:CICLOS;
    h+=`<div class="card" style="margin-top:16px;overflow:hidden">
      <div style="background:linear-gradient(90deg,#001E50,#003D8F);padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:15px;font-weight:700;color:#fff">${diaDetalhe.isSabTrab?"Sábado":"Dia"} ${fmtD(diaDetalhe.iso)}</div>
          <div style="font-family:'Courier New',monospace;font-size:10px;color:rgba(255,255,255,0.5);margin-top:2px">${diaDetalhe.isSabTrab?"12:00–18:00 · 12 ciclos":"15:00–23:45 · 15 ciclos"}</div>
        </div>
        <button onclick="toggleDiaDetalhe(null)" style="background:rgba(255,255,255,0.15);border:none;border-radius:8px;width:32px;height:32px;color:#fff;font-size:16px">✕</button>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px">
        <table style="border-collapse:separate;border-spacing:3px 3px;min-width:${diaDetalhe.isSabTrab?400:700}px">
          <thead><tr>
            <th style="font-family:'Courier New',monospace;background:#F5F6F8;padding:6px 8px;border-radius:6px;font-size:10px;color:#8B919E;font-weight:600;text-align:left;white-space:nowrap;min-width:110px">Operador</th>
            ${ciclosList.map(c=>`<th style="font-family:'Courier New',monospace;background:${c.posJanta?"#F0FAF5":diaDetalhe.isSabTrab?"#E6F6F0":"#F5F6F8"};padding:5px 4px;border-radius:5px;font-size:9px;color:${c.posJanta?"#00875A":"#8B919E"};font-weight:600;text-align:center;white-space:nowrap;min-width:50px">${c.label}<br/>${c.ini}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${opsEx.map(op=>{
              const oi=ops.findIndex(o=>o.id===op.id);
              const falta=DB.faltas?.find(f=>f.opId===op.id&&f.data===diaDetalhe.iso);
              return`<tr>
                <td style="background:${falta?"#FEF2F2":"#F5F6F8"};border-radius:6px;padding:6px 8px">
                  <div style="display:flex;align-items:center;gap:6px">${avHtml(op.nome,oi,22)}<span style="font-size:12px;font-weight:600;color:#1A1E2A">${esc(op.nome)}</span></div>
                </td>
                ${ciclosList.map((_,ci)=>{
                  if(falta)return`<td style="padding:2px"><div style="background:${TIPO_FALTA[falta.tipo]?.bg};border:1px solid ${TIPO_FALTA[falta.tipo]?.cor}44;border-radius:5px;padding:5px 3px;text-align:center;font-family:'Courier New',monospace;font-size:9px;color:${TIPO_FALTA[falta.tipo]?.cor};font-weight:700">${TIPO_FALTA[falta.tipo]?.label.slice(0,3)}</td>`;
                  const pNum=diaDetalhe.isSabTrab?getPostoSab(op.id,ci):getPosto(op.id,diaDetalhe.diaIdx,ci);
                  const p=pInfo(pNum);

  return h;

// ── BIND EVENTS ───────────────────────────────────────────────────────────────
function bindEvents(){
  // Inputs equipe
  const inpNome=document.getElementById("inp-nome");
  if(inpNome){inpNome.addEventListener("input",function(){novoNome=this.value.slice(0,40);document.getElementById("cnt-nome").textContent=novoNome.length+"/40";});inpNome.addEventListener("keydown",function(e){if(e.key==="Enter")addOperador();});}
  const inpReg=document.getElementById("inp-reg");
  if(inpReg){inpReg.addEventListener("input",function(){novoId=this.value.replace(/\D/g,"").slice(0,7);this.value=novoId;const c=document.getElementById("cnt-reg");c.textContent=novoId.length+"/7";c.style.color=novoId.length===7?"#00875A":"#8B919E";});inpReg.addEventListener("keydown",function(e){if(e.key==="Enter")addOperador();});}
  // Inputs sábados
  const sd=document.getElementById("sab-data");if(sd)sd.addEventListener("input",function(){sabData=this.value;});
  const so=document.getElementById("sab-obs");if(so)so.addEventListener("input",function(){sabObs=this.value;});
  // Inputs faltas
  const fo=document.getElementById("f-op");if(fo)fo.addEventListener("change",function(){fOp=this.value;});
  const fd=document.getElementById("f-data");if(fd)fd.addEventListener("input",function(){fData=this.value;});
  const ft=document.getElementById("f-tipo");if(ft)ft.addEventListener("change",function(){fTipo=this.value;});
  const fob=document.getElementById("f-obs");if(fob)fob.addEventListener("input",function(){fObs=this.value;});
  // Postos
  bindPostosEvents();
}

function toggleDiaDetalhe(iso,diaIdx,isSabTrab){if(!iso||diaDetalhe?.iso===iso){diaDetalhe=null;}else{diaDetalhe={iso,diaIdx,isSabTrab};}render();}
function abrirEditar(ci){editCiclo=ci;editVal=getPosto(editOp,editDia,ci);render();}

function setEditVal(v,ci){editVal=v;const grid=document.getElementById("posto-grid-"+ci);if(grid)grid.querySelectorAll(".posto-btn").forEach((b,i)=>{const c=corP(i+1);const sel=v===i+1;b.style.border=`1.5px solid ${c}${sel?"ff":"44"}`;b.style.background=sel?c:c+"0d";b.style.color=sel?"#fff":c;});}
function confirmarEditar(ci){
  const ant=pInfo(getPosto(editOp,editDia,ci)),nv=pInfo(editVal||1);
  if(!DB.rotacaoOverride)DB.rotacaoOverride={};
  if(!DB.rotacaoOverride[editOp])DB.rotacaoOverride[editOp]={};

function restaurar(opId,dIdx,cIdx){

  const op=getOps().find(o=>o.id===opId);

  saveDB();editCiclo=null;editVal=null;toast("Restaurado ✓");render();
}
function copiarDia(opId,orig,dest){
  if(!DB.rotacaoOverride)DB.rotacaoOverride={};
  if(!DB.rotacaoOverride[opId])DB.rotacaoOverride[opId]={};
  DB.rotacaoOverride[opId][dest]={};
  const opIdx=getOps().findIndex(o=>o.id===opId);
  for(let c=0;c<15;c++)DB.rotacaoOverride[opId][dest][c]=getPosto(opId,orig,c);
  const op=getOps().find(o=>o.id===opId);
  DB=logH(DB,"Cópia de dia",`${op?.nome}: ${DIAS_F[orig]} → ${DIAS_F[dest]}`);
  saveDB();toast(`Copiado para ${DIAS_F[dest]}`);render();
}
function abrirSab(ci){editSabCiclo=ci;editSabVal=getPostoSab(editSabOp,ci);render();}
function cancelarSab(){editSabCiclo=null;editSabVal=null;render();}
function setSabVal(v,ci){editSabVal=v;const grid=document.getElementById("sab-posto-grid-"+ci);if(grid)grid.querySelectorAll(".posto-btn").forEach((b,i)=>{const c=corP(i+1);const sel=v===i+1;b.style.border=`1.5px solid ${c}${sel?"ff":"44"}`;b.style.background=sel?c:c+"0d";b.style.color=sel?"#fff":c;});}
function confirmarSab(ci){
  if(!DB.rotacaoSab)DB.rotacaoSab={};
  if(!DB.rotacaoSab[editSabOp]){const oi=getOps().findIndex(o=>o.id===editSabOp);const _s=getSeq();DB.rotacaoSab[editSabOp]=Array.from({length:12},(_,c)=>_s[(oi+c)%_s.length]);}
  DB.rotacaoSab[editSabOp][ci]=editSabVal;
  const op=getOps().find(o=>o.id===editSabOp);
  DB=logH(DB,"Sábado ajuste",`${op?.nome} · C${ci+1}: ${pInfo(editSabVal)?.cod}`);

function travarOp(){
  const selOp=document.getElementById("trav-op");
  const selPosto=document.getElementById("trav-posto");
  if(!selOp||!selPosto){toast("Erro: formulário não encontrado","warn");return;}
  const opId=selOp.value;
  const postoNum=parseInt(selPosto.value||"0");
  if(!opId){toast("Selecione o operador","warn");return;}
  if(!postoNum||isNaN(postoNum)){toast("Selecione o posto","warn");return;}
  const op=getOps().find(o=>o.id===opId);
  const p=pInfo(postoNum);
  if(!p){toast("Posto inválido","warn");return;}
  if(!DB.travados)DB.travados={};
  if(DB.travados[opId]!==undefined){
    const antP=pInfo(DB.travados[opId]);
    if(!confirm(op?.nome+" já está travado em "+antP?.cod+". Substituir por "+p?.cod+"?"))return;
  }
  DB.travados[opId]=postoNum;
  DB=logH(DB,"Operador travado",op?.nome+" → "+p?.cod+" — "+p?.desc);
  saveDB();
  toast(op?.nome+" travado em "+p?.cod+" ✓");
  render();
}
function destravarOp(opId){
  const op=getOps().find(o=>o.id===opId);
  if(!confirm("Destravar "+op?.nome+"? Ele voltará à rotação automática."))return;
  if(DB.travados)delete DB.travados[opId];
  DB=logH(DB,"Operador destravado",(op?.nome||opId)+" voltou à rotação");
  saveDB();
  toast((op?.nome||opId)+" destravado ✓");
  render();
}

function addOperador(){
  const nome=novoNome.trim();
  if(!nome){toast("Digite o nome","warn");return;}
  if(novoId&&novoId.length>0&&novoId.length<7){toast("Registro deve ter 7 dígitos","warn");return;}
  const id=novoId.trim()||`OP${Date.now()}`;
  if(DB.operadores?.find(o=>o.id===id)){toast("ID já existe","warn");return;}
  DB.operadores=[...(DB.operadores||[]),{id,nome}];
  DB=logH(DB,"Operador adicionado",`${nome} · ID ${id}`);
  saveDB();novoNome="";novoId="";opAba="lista";toast(`${nome} cadastrado ✓`);render();
}
function moverOp(opId, dir){
  const ops=getOps();
  const idx=ops.findIndex(o=>o.id===opId);
  const novoIdx=idx+dir;
  if(novoIdx<0||novoIdx>=ops.length)return;
  // Trocar posições
  const nova=[...ops];
  [nova[idx],nova[novoIdx]]=[nova[novoIdx],nova[idx]];
  DB.operadores=nova;
  DB=logH(DB,"Reordenação de equipe",`${ops[idx].nome} ${dir<0?"subiu":"desceu"} (offset ${idx} → ${novoIdx})`);
  saveDB();
  render();
}

function removerOp(opId){
  const op=getOps().find(o=>o.id===opId);
  if(!confirm(`Remover ${op?.nome}?`))return;
  DB.operadores=DB.operadores.filter(o=>o.id!==opId);
  if(DB.rotacaoOverride)delete DB.rotacaoOverride[opId];
  if(DB.rotacaoSab)delete DB.rotacaoSab[opId];
  if(DB.travados)delete DB.travados[opId];
  DB.faltas=DB.faltas?.filter(f=>f.opId!==opId)||[];
  DB=logH(DB,"Operador removido",op?.nome||"");
  saveDB();toast(`${op?.nome} removido`,"warn");render();
}
function addSabado(){
  const data=document.getElementById("sab-data")?.value||sabData;
  const obs=document.getElementById("sab-obs")?.value||sabObs;
  if(!data){toast("Selecione uma data","warn");return;}
  if(DB.sabados?.find(s=>s.data===data)){toast("Já registrado","warn");return;}
  DB.sabados=[...(DB.sabados||[]),{data,obs,id:Date.now()}].sort((a,b)=>a.data.localeCompare(b.data));
  DB=logH(DB,"Sábado adicionado",fmtD(data));
  saveDB();sabData="";sabObs="";toast("Sábado registrado ✓");render();
}
function delSabado(id){
  const s=DB.sabados?.find(x=>x.id===id);
  DB.sabados=DB.sabados?.filter(x=>x.id!==id)||[];
  DB=logH(DB,"Sábado removido",fmtD(s?.data||""));
  saveDB();toast("Removido","warn");render();
}
function addFalta(){
  const op_=document.getElementById("f-op")?.value||fOp;
  const data_=document.getElementById("f-data")?.value||fData;
  const tipo_=document.getElementById("f-tipo")?.value||fTipo;
  const obs_=document.getElementById("f-obs")?.value||fObs;
  if(!data_||!op_){toast("Preencha operador e data","warn");return;}
  DB.faltas=[...(DB.faltas||[]),{id:Date.now(),opId:op_,data:data_,tipo:tipo_,obs:obs_}].sort((a,b)=>b.data.localeCompare(a.data));
  const op=getOps().find(o=>o.id===op_);
  DB=logH(DB,"Ausência registrada",`${op?.nome} · ${fmtD(data_)}`);
  saveDB();fData="";fObs="";toast("Ausência registrada ✓");render();
}
function delFalta(id){
  const f=DB.faltas?.find(x=>x.id===id);
  DB.faltas=DB.faltas?.filter(x=>x.id!==id)||[];
  const op=getOps().find(o=>o.id===f?.opId);
  DB=logH(DB,"Ausência removida",op?.nome||"");
  saveDB();toast("Removido","warn");render();
}
function resetDB(){if(!confirm("Apagar TODOS os dados?"))return;DB=DB0();saveDB();toast("Banco resetado","warn");render();}
function resetSeqPostos(){if(!confirm("Resetar postos e sequência para o padrão?"))return;DB.seq=null;DB.postos=null;saveDB();toast("Postos e sequência resetados","warn");render();}

// ── AÇÕES POSTOS E SEQUÊNCIA ──────────────────────────────────────────────────
function setPostosAba(k){postosAba=k;render();}
function bindPostosEvents(){
  const pc=document.getElementById("inp-pcod");
  if(pc)pc.addEventListener("input",function(){novoCod=this.value.toUpperCase().slice(0,10);this.value=novoCod;});
  const pd=document.getElementById("inp-pdesc");
  if(pd)pd.addEventListener("input",function(){novaDesc=this.value.slice(0,60);});
}
function addPosto(){
  const cod_=document.getElementById("inp-pcod")?.value?.trim().toUpperCase()||novoCod.trim();
  const desc_=document.getElementById("inp-pdesc")?.value?.trim()||novaDesc.trim();
  if(!cod_){toast("Digite o código","warn");return;}
  if(!desc_){toast("Digite a descrição","warn");return;}
  const P=getPostos();
  if(P.find(p=>p.cod.toUpperCase()===cod_)){toast("Código já existe","warn");return;}
  const novos=[...P,{cod:cod_,desc:desc_}];
  DB.postos=novos;
  DB=logH(DB,"Posto adicionado",`${cod_} — ${desc_}`);
  saveDB();novoCod="";novaDesc="";toast(`${cod_} cadastrado ✓`);render();
}
function delPosto(idx){
  const P=getPostos();
  const p=P[idx];
  if(!confirm(`Remover ${p?.cod} — ${p?.desc}?`))return;
  // Verificar se está na sequência
  const numPosto=idx+1;
  const S=getSeq();
  const naSeq=S.includes(numPosto);
  if(naSeq&&!confirm(`Este posto está na sequência de rotação (${S.filter(n=>n===numPosto).length}x). Remover mesmo assim?`))return;
  const novos=P.filter((_,i)=>i!==idx);
  // Reindexar sequência: números maiores que idx+1 diminuem 1
  DB.postos=novos;
  DB.seq=S.map(n=>{if(n===numPosto)return 0;if(n>numPosto)return n-1;return n;}).filter(n=>n>0);
  DB=logH(DB,"Posto removido",`${p?.cod}`);
  saveDB();toast(`${p?.cod} removido`,"warn");render();
}
function iniciarEditarSeq(){seqTemp=[...getSeq()];render();}
function cancelarSeq(){seqTemp=null;render();}
function addNaSeq(n){
  if(!seqTemp)return;
  seqTemp=[...seqTemp,n];
  // Atualizar visual sem re-render completo
  render();
}
function remDaSeq(idx){
  if(!seqTemp)return;
  seqTemp=seqTemp.filter((_,i)=>i!==idx);
  render();
}
function salvarSeq(){
  if(!seqTemp||seqTemp.length===0){toast("Sequência não pode estar vazia","warn");return;}
  DB.seq=seqTemp;
  DB=logH(DB,"Sequência alterada",`${seqTemp.length} posições`);
  saveDB();seqTemp=null;toast("Sequência salva ✓");render();
}

// ── ATUALIZAR APP ────────────────────────────────────────────────────────────
function atualizarApp(){
  const btn=document.getElementById("btn-atualizar");
  if(btn){btn.classList.add("girando");btn.disabled=true;}
  // Limpa caches do service worker se disponível
  if('caches' in window){
    caches.keys().then(keys=>{
      Promise.all(keys.map(k=>caches.delete(k))).then(()=>{
        if('serviceWorker' in navigator){
          navigator.serviceWorker.getRegistrations().then(regs=>{
            Promise.all(regs.map(r=>r.unregister())).then(()=>{
              setTimeout(()=>window.location.reload(true),300);
            });
          });
        } else {
          setTimeout(()=>window.location.reload(true),300);
        }
      });
    });
  } else {
    setTimeout(()=>window.location.reload(true),300);
  }
}
